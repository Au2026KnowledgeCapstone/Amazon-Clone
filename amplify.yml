version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd amazon-frontend
        - npm ci --legacy-peer-deps
    build:
      commands:
        - NODE_OPTIONS=--openssl-legacy-provider npm run build
  artifacts:
    baseDirectory: amazon-frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - amazon-frontend/node_modules/**/*
